// The APK: the engine's libmain.so (SDL3 linked in, built from source) and SDL's own Java glue
// (its android-project's org.libsdl.app, from the same SDL source: SDL3_SOURCE_DIR, else
// android/SDL - a checkout of the commit engine/CMakeLists.txt fetches).
plugins {
    id 'com.android.application'
}

def sdlDir = System.getenv('SDL3_SOURCE_DIR') ?: "${rootDir}/SDL"
// The version: engine/CMakeLists.txt's CR_VERSION (x.y.z), so a release bumps it in one place; the
// version code x * 10000 + y * 100 + z, above every earlier build's (11)
def crVersion = (file("${rootDir}/../engine/CMakeLists.txt").text =~ /set\(CR_VERSION "(\d+)\.(\d+)\.(\d+)"/)[0]

android {
    namespace 'local.preservation.chaosrings2'
    compileSdk 36 // (SDL 3.5's Java glue calls API 36's Display.getHighestHdrSdrRatio, behind a version check)
    if (project.hasProperty('ndkVersion')) ndkVersion project.property('ndkVersion')

    defaultConfig {
        applicationId 'local.preservation.chaosrings2'
        minSdk 24
        targetSdk 35
        versionCode crVersion[1].toInteger() * 10000 + crVersion[2].toInteger() * 100 + crVersion[3].toInteger()
        versionName "${crVersion[1]}.${crVersion[2]}.${crVersion[3]}"
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments "-DFETCHCONTENT_SOURCE_DIR_SDL3=${sdlDir}", '-DANDROID_STL=c++_static'
                targets 'cr2view' // (its library: libmain.so)
            }
        }
    }
    // The ports' release key (CI: the repository's ANDROID_KEYSTORE_* secrets), so each build installs
    // over the one before it; without it - a fork's build, one's own - the debug key
    signingConfigs {
        if (System.getenv('ANDROID_KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD') // (PKCS12: the store's)
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path '../../engine/CMakeLists.txt'
            version '3.22.1'
        }
    }
    sourceSets {
        main { java.srcDirs += "${sdlDir}/android-project/app/src/main/java" }
    }
}
